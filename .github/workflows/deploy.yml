# Build the backend and storefront images, push them to GHCR, then deploy
# them on the VPS over SSH (healthcheck + automatic rollback).
#
# Repository variables (Settings › Secrets and variables › Actions › Variables):
#   DEPLOY_ENABLED                      "true" once the VPS is ready (else: build only)
#   NEXT_PUBLIC_MEDUSA_BACKEND_URL      https://api-essadrati.nocido.com
#   NEXT_PUBLIC_SITE_URL                https://essadrati.nocido.com
#   NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY  production publishable key (public value)
#   PUBLIC_STOREFRONT_URL               https://essadrati.nocido.com (post-deploy check)
#   PUBLIC_API_URL                      https://api-essadrati.nocido.com (post-deploy check)
# Repository secrets:
#   VPS_HOST, VPS_USER (deploy-essadrati), VPS_SSH_KEY (private key),
#   VPS_KNOWN_HOSTS (ssh-keyscan output of the VPS)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/essadrati

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, storefront]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

  deploy:
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Copy compose and infra files
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy" \
            docker-compose.prod.yml infra/nginx infra/scripts infra/backup infra/postgres \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/essadrati/staging/"
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/essadrati
            cp staging/docker-compose.prod.yml .
            mkdir -p infra
            for dir in nginx scripts backup postgres; do rm -rf "infra/$dir"; cp -R "staging/$dir" infra/; done
            chmod +x infra/scripts/*.sh infra/backup/*.sh infra/postgres/*.sh'
      - name: Deploy with rollback
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null \
             && /opt/essadrati/infra/scripts/deploy.sh '${{ github.sha }}'; status=\$?; docker logout ghcr.io > /dev/null; exit \$status"
      - name: Public healthcheck
        id: health
        run: |
          for url in "${{ vars.PUBLIC_API_URL }}/health" "${{ vars.PUBLIC_STOREFRONT_URL }}/api/health"; do
            for attempt in 1 2 3 4 5 6; do
              curl -fsS --max-time 10 "$url" > /dev/null && break
              [ "$attempt" = 6 ] && { echo "unhealthy: $url"; exit 1; }
              sleep 10
            done
          done
      # deploy.sh already rolls back when the containers are unhealthy; this
      # covers a release that is healthy inside but broken behind Nginx.
      - name: Roll back on public failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/opt/essadrati/infra/scripts/deploy.sh --rollback"
