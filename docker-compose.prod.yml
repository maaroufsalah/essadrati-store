# Production on the VPS.
# - PostgreSQL runs on the host, outside Docker. Containers reach it through
#   host.docker.internal (mapped to the Docker host gateway).
# - Nginx runs on the host and proxies to 127.0.0.1:3121 (backend) and
#   127.0.0.1:3120 (storefront); 3000/3001 are taken by other apps.
#   Nothing is published on a public interface.
# - Redis lives on an internal network with no route to the outside.
# Compose-level values come from .env.prod (see .env.prod.example).
name: ${COMPOSE_PROJECT_NAME:-essadrati}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  backend:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/${IMAGE_PREFIX:-essadrati}-backend:${IMAGE_TAG:-latest}
    env_file:
      - ./infra/env/backend.prod.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      # PDF invoices: Chromium is installed in the image. Its sandbox needs
      # user namespaces, unavailable with cap_drop ALL and no-new-privileges.
      PDF_BROWSER_PATH: /usr/bin/chromium-browser
      PDF_BROWSER_NO_SANDBOX: "true"
    # Chromium renders in shared memory.
    shm_size: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3121}:9000"
    volumes:
      - ${UPLOADS_DIR:?set UPLOADS_DIR}:/app/uploads
    networks:
      - edge
      - internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  storefront:
    <<: *hardening
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/${IMAGE_PREFIX:-essadrati}-storefront:${IMAGE_TAG:-latest}
    env_file:
      - ./infra/env/storefront.prod.env
    environment:
      NODE_ENV: production
      # Server-side calls stay on the Docker network.
      MEDUSA_INTERNAL_URL: http://backend:9000
    ports:
      - "127.0.0.1:${STOREFRONT_PORT:-3120}:3000"
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    <<: *hardening
    image: redis:7-alpine
    user: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  # Fixed subnet inside 172.16.0.0/12, the range the host already opens to
  # PostgreSQL (UFW) and that the essadrati pg_hba.conf line allows.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_EDGE_SUBNET:-172.31.10.0/24}
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${DOCKER_INTERNAL_SUBNET:-172.31.11.0/24}

volumes:
  redis-data:
