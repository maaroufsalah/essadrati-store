# ===========================================================================
#  essadrati - HTTPS (staging, domaine final essadratibio.ma plus tard)
#    essadrati.nocido.com        -> 127.0.0.1:3120  storefront (Next.js)
#    api-essadrati.nocido.com    -> 127.0.0.1:3121  backend Medusa (API store,
#                                                    fichiers /static)
#    admin-essadrati.nocido.com  -> 127.0.0.1:3121  backend Medusa (dashboard
#                                                    /app, API /admin)
#
#  3000/3001 et 3100-3104 sont pris sur cet hôte : la pile publie 3120/3121
#  (STOREFRONT_PORT / BACKEND_PORT dans /opt/essadrati/.env.prod).
#  Certificat : /etc/letsencrypt/live/essadrati.nocido.com (SAN sur les 3
#  noms), webroot HTTP-01 comme les autres projets.
#  Zones de limitation préfixées essadrati_ : aucune autre zone touchée.
#  Ne touche à aucun autre vhost : server_name explicites.
# ===========================================================================

limit_req_zone $binary_remote_addr zone=essadrati_store:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=essadrati_admin:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=essadrati_auth:10m rate=10r/m;

# ------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name essadrati.nocido.com api-essadrati.nocido.com admin-essadrati.nocido.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------- STOREFRONT ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name essadrati.nocido.com;

    ssl_certificate     /etc/letsencrypt/live/essadrati.nocido.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essadrati.nocido.com/privkey.pem;

    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Fingerprinted Next.js assets: immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3120;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_redirect off;
        # COD orders run a workflow: leave them time.
        proxy_read_timeout 90s;
    }
}

# ------------------------------------------------------------- API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-essadrati.nocido.com;

    ssl_certificate     /etc/letsencrypt/live/essadrati.nocido.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essadrati.nocido.com/privkey.pem;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Uploaded media, served from the host volume (FILE_BASE_URL=.../static).
    location /static/ {
        alias /opt/essadrati/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The dashboard and the admin API live on the admin domain only.
    location /app {
        return 301 https://admin-essadrati.nocido.com$request_uri;
    }
    location /admin/ {
        return 404;
    }

    location /store/ {
        limit_req zone=essadrati_store burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
    }

    location /auth/ {
        limit_req zone=essadrati_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
    }
}

# ------------------------------------------------------------- ADMIN --------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin-essadrati.nocido.com;

    ssl_certificate     /etc/letsencrypt/live/essadrati.nocido.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essadrati.nocido.com/privkey.pem;

    # Media uploads from the dashboard.
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Keep the dashboard out of search engines.
    add_header X-Robots-Tag              "noindex, nofollow" always;

    location = / {
        return 302 /app;
    }

    location /admin/ {
        limit_req zone=essadrati_admin burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
        # PDF generation and CSV imports.
        proxy_read_timeout 120s;
    }

    location /auth/ {
        limit_req zone=essadrati_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
    }

    location / {
        proxy_pass http://127.0.0.1:3121;
        include /opt/essadrati/infra/nginx/essadrati-proxy.inc;
    }
}
