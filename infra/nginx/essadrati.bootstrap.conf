# ===========================================================================
#  essadrati - phase 1 (avant certificat) - HTTP seulement
#    Sert uniquement le défi ACME (webroot /var/www/certbot) pour les trois
#    noms, le temps d'obtenir le certificat. Remplacé ensuite par
#    essadrati.conf. Ne touche à aucun autre vhost : server_name explicites.
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name essadrati.nocido.com api-essadrati.nocido.com admin-essadrati.nocido.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 503;
    }
}
